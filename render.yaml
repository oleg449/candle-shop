services:
  - type: web
    name: candle-shop-web
    env: node
    buildCommand: npm ci && npm rebuild sqlite3 --build-from-source
    startCommand: node server.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PROMO_CODE
        generateValue: true
      - key: AUTH_COOKIE_NAME
        value: auth_token
      - key: CORS_ALLOWED_ORIGINS
        value: ""
      - key: DB_PATH
        value: /var/data/users.db
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: CONTENT_DIR
        value: /var/data/content
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
